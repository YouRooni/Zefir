[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose = "1.12.2"
material3 = "1.12.0-alpha03"
icons = "1.7.3"
kolor = "5.0.1"
ktor = "3.6.1"
coroutines = "1.11.0"
serialization = "1.11.0"
activity = "1.11.0"
core = "1.17.0"
qrose = "1.3.1"
snakeyaml = "2.5"
scanner = "16.1.0"
zxing = "4.3.0"
work = "2.12.0"
jna = "5.17.0"

[libraries]
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
icons = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "icons" }
kolor = { module = "com.materialkolor:material-kolor", version.ref = "kolor" }
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
coroutines-play = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }

qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "scanner" }
zxing = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing" }
work = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
